<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLevel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>LifeLevel</h1>
    <p class="level">Lv.1</p>
  </header>

  <main>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="タスクを入力">
      <input id="exp-input" type="number" min="1" max="100" placeholder="EXP">
      <button type="submit">追加</button>
    </form>

    <ul class="task-list"></ul>

    <section class="exp-status">
      <p class="exp-text">EXP 0 / 100</p>

      <div class="exp-bar">
        <div class="exp-fill"></div>
      </div>
    </section>

    <section class="habit-status">
      <div class="status-card">
        <p class="daily-exp-text">Daily EXP 0 / 100</p>
      </div>
      
      <div class="status-card">
        <p class="achievement-rate">累計達成率 0%</p>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>

</html>
