<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLevel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>LifeLevel</h1>
    <p class="level">Lv.0</p>
  </header>

  <main>
    <form>
      <input type="text" placeholder="タスクを入力">
      <button type="submit">追加</button>
    </form>

    <ul class="task-list"></ul>

    <section class="exp-status">
      <p class="exp-text">EXP 0 / 100</p>

      <div class="exp-bar">
        <div class="exp-fill"></div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>

</html>
